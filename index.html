<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<meta name="claude:viewport-fit-sides" content="cover">
<title>خصومات دارك لاند</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#ececee; --fg:#17171a; --muted:#6b6b73;
  --line:#dcdce0; --accent:#0d8e8e; --accent-ink:#08484a; --ok:#1f8a4c; --free:#1f8a4c;
  --strike:#9a9aa2; --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.05);
  --r:14px;
  --ff-ui:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --ff-head:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1b1b1f; --surface-2:#26262b; --fg:#f2f2f4; --muted:#9a9aa3;
  --line:#33333a; --accent:#2fd4cf; --accent-ink:#2fd4cf; --ok:#43c478; --free:#43c478;
  --strike:#6b6b73; --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1b1b1f; --surface-2:#26262b; --fg:#f2f2f4; --muted:#9a9aa3;
  --line:#33333a; --accent:#2fd4cf; --accent-ink:#2fd4cf; --ok:#43c478; --free:#43c478;
  --strike:#6b6b73; --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{direction:rtl;background:var(--bg);color:var(--fg);font-family:var(--ff-ui);margin:0;
  display:flex;flex-direction:column;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.brand h1{font-family:var(--ff-head);font-size:1.15rem;font-weight:700;margin:0;letter-spacing:.01em;
  display:flex;align-items:center;gap:9px}
.dot{width:11px;height:11px;border-radius:3px;background:var(--fg);display:inline-block}
.count{font-size:.72rem;color:var(--muted);font-weight:500}
.themebtn{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);border-radius:9px;
  width:34px;height:34px;font-size:1rem;display:grid;place-items:center}
.searchwrap{padding-bottom:12px}
.search{position:relative}
.search input{width:100%;font-family:var(--ff-ui);font-size:1.05rem;font-weight:500;color:var(--fg);
  background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:13px 44px 13px 14px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1.05rem}
.search .clr{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--muted);font-size:1.3rem;line-height:1;padding:6px;border-radius:8px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:12px 150px}
.hint{color:var(--muted);font-size:.9rem;text-align:center;padding:30px 10px;line-height:1.7}
.rescount{color:var(--muted);font-size:.74rem;font-weight:500;margin:2px 2px 10px}
.list{display:flex;flex-direction:column;gap:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 13px}
.cardtop{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.model{font-weight:700;font-size:1.08rem;min-width:0;word-break:break-word;line-height:1.3;font-family:var(--ff-head)}
.model .vcnt{color:var(--muted);font-weight:500;font-size:.8rem;font-family:var(--ff-ui)}
.prices{text-align:center;display:flex;flex-direction:column;gap:1px;line-height:1.15;white-space:nowrap}
.orig{color:var(--strike);text-decoration:line-through;font-size:.8rem;font-variant-numeric:tabular-nums}
.disc{color:var(--accent-ink);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums;font-family:var(--ff-head)}
.disc.range{font-size:1.02rem}
.disc small{font-size:.62rem;font-weight:500;color:var(--muted)}
.cardbtns{grid-column:1/-1;margin-top:9px;display:flex;gap:8px}
.addbtn{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);font-weight:600;
  font-size:.9rem;border-radius:10px;padding:9px;display:flex;align-items:center;justify-content:center;gap:7px}
.addbtn:active{background:var(--accent);color:#042a2a;border-color:var(--accent)}
.addbtn.added{background:var(--accent);color:#042a2a;border-color:var(--accent)}
.expbtn{flex:1;background:none;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:.86rem;
  border-radius:10px;padding:9px;display:flex;align-items:center;justify-content:center;gap:6px}
.expbtn.full{flex:1}
.variants{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;
  background:var(--surface-2);border-radius:10px;padding:7px 9px}
.vrow .vlab{font-size:.85rem;font-weight:600;min-width:0;word-break:break-word}
.vrow .vpr{text-align:center;font-variant-numeric:tabular-nums}
.vrow .vpr b{color:var(--accent-ink);font-weight:700;font-size:1rem}
.vrow .vpr .vwas{display:block;font-size:.66rem;color:var(--strike);text-decoration:line-through;font-weight:500}
.vrow .vadd{background:var(--surface);border:1px solid var(--line);color:var(--fg);font-weight:700;font-size:1.05rem;
  width:34px;height:34px;border-radius:9px;line-height:1;flex:none}
.vrow .vadd:active,.vrow .vadd.added{background:var(--accent);color:#042a2a;border-color:var(--accent)}

.basketbar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -6px 24px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.bsummary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:11px}
.bsummary .lbl{font-size:.78rem;color:var(--muted);font-weight:500}
.bsummary .tot{font-family:var(--ff-head);font-weight:700;font-size:1.45rem;font-variant-numeric:tabular-nums}
.bsummary .tot small{font-size:.7rem;color:var(--muted);font-weight:500}
.bsummary .cta{background:var(--accent);color:#042a2a;border:none;font-weight:700;font-size:.92rem;border-radius:11px;
  padding:11px 16px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.bsummary .cta .n{background:rgba(0,0,0,.18);border-radius:20px;padding:1px 8px;font-size:.82rem}
.bogo{display:flex;align-items:center;gap:9px;padding-block:0 11px;margin-top:-2px}
.bogo label{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600;color:var(--fg);cursor:pointer}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;transition:.15s}
.slider::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--muted);top:2px;inset-inline-start:2px;transition:.15s}
.switch input:checked + .slider{background:var(--accent);border-color:var(--accent)}
.switch input:checked + .slider::before{background:#042a2a;transform:translateX(-18px)}
.bogo .tag{font-size:.68rem;color:var(--muted)}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheetcard{background:var(--bg);width:100%;max-height:82%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheethead{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 10px;border-bottom:1px solid var(--line)}
.sheethead h2{font-family:var(--ff-head);font-size:1.1rem;margin:0}
.sheethead button{background:none;border:none;color:var(--muted);font-size:1.5rem;line-height:1;padding:4px 8px}
.items{overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.brow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px;
  display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center}
.brow .nm{font-weight:600;font-size:.9rem;min-width:0;word-break:break-word}
.brow .nm .sz{color:var(--muted);font-weight:500;font-size:.8rem}
.brow .pr{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.brow .pr .was{display:block;font-size:.7rem;color:var(--strike);text-decoration:line-through;font-weight:500}
.brow .pr .freeTag{color:var(--free);font-size:.9rem}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:1.1rem;font-weight:700;line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sheetfoot{border-top:1px solid var(--line);padding:13px 16px;display:flex;flex-direction:column;gap:10px}
.totrow{display:flex;align-items:baseline;justify-content:space-between}
.totrow .big{font-family:var(--ff-head);font-weight:700;font-size:1.7rem;font-variant-numeric:tabular-nums}
.totrow .save{color:var(--ok);font-size:.82rem;font-weight:600}
.breakdown{font-size:.75rem;color:var(--muted);line-height:1.6}
.clearbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px;font-weight:600;font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:.9rem}

.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.gate[hidden]{display:none}
[hidden]{display:none!important}
.gate .box{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw)}
.gate h1{font-family:var(--ff-head);font-size:1.3rem;margin:0;display:flex;gap:9px;align-items:center;justify-content:center}
.gate p{color:var(--muted);font-size:.86rem;margin:0;line-height:1.6}
.gate input{font-family:var(--ff-ui);font-size:1.3rem;text-align:center;letter-spacing:.3em;padding:13px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--fg);outline:none}
.gate input:focus{border-color:var(--accent)}
.gate .go{background:var(--accent);color:#042a2a;border:none;font-weight:700;font-size:1rem;border-radius:12px;padding:13px}
.gate .err{color:#d23b3b;font-size:.82rem;min-height:1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="gate" id="gate">
  <div class="box">
    <h1><span class="dot"></span> دارك لاند</h1>
    <p>الصفحة دي لموظفي دارك لاند. اكتب كود الدخول.</p>
    <input id="gateInput" type="tel" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
    <button class="go" id="gateGo">دخول</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="gutter brand">
      <h1><span class="dot"></span> دارك لاند <span class="count" id="itemCount"></span></h1>
      <button class="themebtn" id="themeBtn" title="تبديل الوضع">◐</button>
    </div>
    <div class="gutter searchwrap">
      <div class="search">
        <span class="ic">🔎</span>
        <input id="q" type="search" inputmode="search" placeholder="اكتب كود الموديل… مثلاً AYD" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="clr" hidden>×</button>
      </div>
    </div>
  </header>

  <main class="gutter" id="main">
    <div class="hint" id="hint">اكتب كود الموديل أو جزء منه<br>عشان تظهر مقاساته وأسعاره بعد الخصم</div>
    <div class="rescount" id="rescount" hidden></div>
    <div class="list" id="list"></div>
  </main>

  <div class="basketbar">
    <div class="gutter bogo">
      <label><span class="switch"><input type="checkbox" id="bogo"><span class="slider"></span></span> عرض «قطعة على قطعة» شغّال؟</label>
      <span class="tag">لو شغّال، الأداة تختار العرض الأوفر للعميل تلقائيًا</span>
    </div>
    <div class="gutter bsummary">
      <div>
        <div class="lbl">الإجمالي بعد الخصم</div>
        <div class="tot" id="barTot">0 <small>ج</small></div>
      </div>
      <button class="cta" id="openSheet">السلة <span class="n" id="barCount">0</span></button>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheetcard">
      <div class="sheethead"><h2>السلة</h2><button id="closeSheet">×</button></div>
      <div class="items" id="items"><div class="empty">السلة فاضية</div></div>
      <div class="sheetfoot">
        <div class="totrow"><span>الإجمالي</span><span class="big" id="sheetTot">0 ج</span></div>
        <div class="totrow"><span class="breakdown" id="breakdown"></span><span class="save" id="saveLine"></span></div>
        <button class="clearbtn" id="clearBtn">تفريغ السلة</button>
      </div>
    </div>
  </div>
</div>

const BRAND = "darkland";

const PLUS = 90, PAIR_CUT = 25;

const gate=document.getElementById('gate'), app=document.getElementById('app');
function unlock(){ gate.hidden=true; app.hidden=false; try{localStorage.setItem('dl_ok','1')}catch(e){}; document.getElementById('q').focus(); }
try{ if(localStorage.getItem('dl_ok')==='1'){ unlock(); } }catch(e){}

/* ---- theme ---- */
document.getElementById('themeBtn').onclick=()=>{

/* ---- index ---- */
function norm(s){ return s.toString().toLowerCase()
  .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim(); }
const INDEX = MODELS.map((m,mi)=>({mi, code:m[0], key:norm(m[0]+' '+m[1].map(v=>v[0]).join(' '))}));
let totalVariants=0; MODELS.forEach(m=>totalVariants+=m[1].length);
document.getElementById('itemCount').textContent = '('+MODELS.length.toLocaleString('ar-EG')+' موديل)';
function esc(s){ return s.toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const ar=n=>Number(n).toLocaleString('ar-EG');

/* ---- search / render ---- */
const qEl=document.getElementById('q'), listEl=document.getElementById('list'),
      hintEl=document.getElementById('hint'), rc=document.getElementById('rescount'), clr=document.getElementById('clr');
let lastQ='';
function modelCard(mi){
  const m=MODELS[mi], vs=m[1], uni=m[2]===1, n=vs.length;
  const origMin=Math.min(...vs.map(v=>v[1])), origMax=Math.max(...vs.map(v=>v[1]));
  let priceHtml, btns;
  if(uni){
    const s=m[3];
    const origTxt = origMin===origMax? ar(origMin) : ar(origMin)+'–'+ar(origMax);
    priceHtml=`<span class="orig">${origTxt}</span><span class="disc">${ar(s)} <small>ج</small></span>`;
    btns=`<button class="addbtn" data-add="${mi}:-1">＋ ضيف للسلة</button>`
       + (n>1?`<button class="expbtn" data-exp="${mi}">المقاسات (${ar(n)}) ▾</button>`:'');
  } else {
    priceHtml=`<span class="disc range">من ${ar(m[3])} لـ ${ar(m[4])} <small>ج</small></span>`;
    btns=`<button class="expbtn full" data-exp="${mi}">اعرض الأسعار والمقاسات (${ar(n)}) ▾</button>`;
  }
  const vcnt = n>1? `<span class="vcnt">· ${ar(n)} لون/مقاس</span>` : (vs[0][0]?`<span class="vcnt">· ${esc(vs[0][0])}</span>`:'');
  return `<div class="card" data-mi="${mi}">
    <div class="cardtop">
      <div class="model">${esc(m[0])} ${vcnt}</div>
      <div class="prices">${priceHtml}</div>
      <div class="cardbtns">${btns}</div>
    </div>
    <div class="variants" id="var-${mi}" hidden></div>
  </div>`;
}
function variantRows(mi){
  const vs=MODELS[mi][1];
  return vs.map((v,vi)=>`<div class="vrow">
      <div class="vlab">${esc(v[0]||'—')}</div>
      <div class="vpr"><span class="vwas">${ar(v[1])}</span><b>${ar(v[2])} ج</b></div>
      <button class="vadd" data-add="${mi}:${vi}">＋</button>
    </div>`).join('');
}
function render(){
  const raw=qEl.value.trim(); clr.hidden=!raw;
  const q=norm(raw);
  if(!q){ listEl.innerHTML=''; hintEl.hidden=false; rc.hidden=true; return; }
  hintEl.hidden=true;
  const terms=q.split(' ').filter(Boolean);
  const hits=[];
  for(const it of INDEX){ if(terms.every(t=>it.key.includes(t))){ hits.push(it.mi); if(hits.length>=80)break; } }
  rc.hidden=false; rc.textContent = hits.length? (hits.length>=80?'+80 موديل — اكتب أكتر عشان تقرّب':ar(hits.length)+' موديل') : '';
  if(!hits.length){ listEl.innerHTML='<div class="hint">مفيش موديل بالكود ده</div>'; }
  else listEl.innerHTML = hits.map(modelCard).join('');
  markAdded();
  logSearch(raw);
}
let tmr; qEl.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(render,100); });
clr.onclick=()=>{ qEl.value=''; qEl.focus(); render(); };

function logSearch(term){ if(term===lastQ||term.length<2)return; lastQ=term;
  try{ const k='dl_log'; const a=JSON.parse(localStorage.getItem(k)||'[]'); a.push({t:term,at:Date.now()});
    if(a.length>500)a.splice(0,a.length-500); localStorage.setItem(k,JSON.stringify(a)); }catch(e){} }

/* ---- basket ---- key "mi:vi" (vi=-1 = generic uniform) -> {code,label,orig,single,pair,qty} ---- */
let basket={};
try{ const b=localStorage.getItem('dl_basket'); if(b)basket=JSON.parse(b); }catch(e){}
function saveBasket(){ try{localStorage.setItem('dl_basket',JSON.stringify(basket))}catch(e){} }
function entryFor(key){
  const [mi,vi]=key.split(':').map(Number); const m=MODELS[mi];
  if(vi<0){ const v=m[1][0]; return {code:m[0],label:'',orig:v[1],single:m[3],pair:v[3]}; }
  const v=m[1][vi]; return {code:m[0],label:v[0],orig:v[1],single:v[2],pair:v[3]};
}
function addItem(key){ if(!basket[key])basket[key]={qty:0,...entryFor(key)}; basket[key].qty++; saveBasket(); paint(); }
function setQty(key,d){ if(!basket[key])return; basket[key].qty+=d; if(basket[key].qty<=0)delete basket[key]; saveBasket(); paint(); markAdded(); }

function pieces(){ const out=[]; for(const k in basket){ const e=basket[k]; for(let i=0;i<e.qty;i++)out.push({key:k,...e}); } return out; }
function calcNormal(ps){ const n=ps.length; let total=0; const lp={};
  ps.forEach(p=>{ const pr=n>=2?p.pair:p.single; total+=pr; (lp[p.key]=lp[p.key]||[]).push(pr); }); return {total,lp}; }
function calcBogo(ps){ let total=0; const lp={}; const sorted=[...ps].sort((a,b)=>b.orig-a.orig);
  const add=(p,price)=>{ total+=price; (lp[p.key]=lp[p.key]||[]).push(price); };
  for(let k=0;k<sorted.length;k+=2){ if(k+1<sorted.length){ add(sorted[k],sorted[k].orig); add(sorted[k+1],0);} else add(sorted[k],sorted[k].single); }
  return {total,lp}; }
function compute(){
  const ps=pieces(); const n=ps.length;
  const bogoOn=document.getElementById('bogo').checked;
  const baseOrig=ps.reduce((a,p)=>a+p.orig,0);
  const normal=calcNormal(ps);
  // BOGO not running, or <2 pieces -> normal discount only
  if(!bogoOn || n<2) return {ps,n,baseOrig,total:normal.total,linePrice:normal.lp,mode:'normal',note:''};
  // both offers running -> auto-pick the cheaper for the customer
  const bogo=calcBogo(ps); const diff=normal.total-bogo.total;
  if(bogo.total<normal.total)
    return {ps,n,baseOrig,total:bogo.total,linePrice:bogo.lp,mode:'bogo',note:'✓ اعمل «قطعة على قطعة» — أوفر للعميل بـ '+ar(diff)+' ج'};
  return {ps,n,baseOrig,total:normal.total,linePrice:normal.lp,mode:'normal',
    note: diff<0 ? '✓ اعمل خصم القطعتين — أوفر للعميل بـ '+ar(-diff)+' ج' : '✓ العرضين بنفس السعر — اعمل أي واحد'};
}
function paint(){
  const c=compute();
  document.getElementById('barTot').innerHTML = ar(c.total)+' <small>ج</small>';
  document.getElementById('barCount').textContent = ar(c.n);
  const itemsEl=document.getElementById('items');
  const keys=Object.keys(basket);
  if(!keys.length){ itemsEl.innerHTML='<div class="empty">السلة فاضية</div>'; }
  else{
    itemsEl.innerHTML=keys.map(k=>{
      const e=basket[k];
      const prices=(c.linePrice[k]||[]).slice().sort((a,b)=>a-b);
      const shown=prices.map(p=> p===0?`<span class="freeTag">مجانًا</span>`:ar(p)).join(' + ')||'0';
      return `<div class="brow">
        <div class="nm">${esc(e.code)} ${e.label?`<span class="sz">${esc(e.label)}</span>`:''}</div>
        <div class="pr"><span class="was">${ar(e.orig*e.qty)}</span>${shown} ج</div>
        <div class="qty"><button data-m="${k}">−</button><span>${ar(e.qty)}</span><button data-p="${k}">＋</button></div>
      </div>`;
    }).join('');
  }
  document.getElementById('sheetTot').textContent = ar(c.total)+' ج';
  const save=c.baseOrig-c.total;
  document.getElementById('saveLine').textContent = c.n? ('وفّرت '+ar(save)+' ج'):'';
  let bd='';
  if(c.n===0) bd='';
  else if(c.note) bd=c.note;
  else if(c.n>=2) bd='خصم القطعتين فأكتر (−'+PAIR_CUT+' ج لكل قطعة)';
  else bd='سعر القطعة الواحدة بعد الخصم';
  const bdEl=document.getElementById('breakdown');
  bdEl.textContent=bd; bdEl.style.color = c.note? 'var(--ok)':'var(--muted)'; bdEl.style.fontWeight = c.note?'600':'400';
}
function markAdded(){
  document.querySelectorAll('[data-add]').forEach(b=>{
    const inb = !!basket[b.dataset.add];
    b.classList.toggle('added', inb);
    if(b.classList.contains('addbtn')) b.textContent = inb? '✓ في السلة' : '＋ ضيف للسلة';
  });
}

/* events */
document.addEventListener('click',e=>{
  const add=e.target.closest('[data-add]'); if(add){ addItem(add.dataset.add); markAdded(); return; }
  const exp=e.target.closest('[data-exp]'); if(exp){
    const mi=exp.dataset.exp, box=document.getElementById('var-'+mi);
    if(box.hidden){ box.innerHTML=variantRows(mi); box.hidden=false; exp.innerHTML=exp.innerHTML.replace('▾','▴'); markAdded(); }
    else { box.hidden=true; box.innerHTML=''; exp.innerHTML=exp.innerHTML.replace('▴','▾'); }
    return;
  }
  if(e.target.dataset.p!=null){ setQty(e.target.dataset.p,+1); }
  if(e.target.dataset.m!=null){ setQty(e.target.dataset.m,-1); }
});
document.getElementById('bogo').onchange=paint;
const sheet=document.getElementById('sheet');
document.getElementById('openSheet').onclick=()=>sheet.classList.add('open');
document.getElementById('closeSheet').onclick=()=>sheet.classList.remove('open');
sheet.onclick=e=>{ if(e.target===sheet)sheet.classList.remove('open'); };
document.getElementById('clearBtn').onclick=()=>{ basket={}; saveBasket(); paint(); markAdded(); };
paint();
</script>

</html>
