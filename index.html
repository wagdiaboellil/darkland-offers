const SK="dlq_v2";
const dec=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function derive(code){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(CFG.salt),iterations:CFG.iters,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function unlock(code){
  const key=await derive(code);
  for(const w of CFG.wrapped){
    let dkRaw;
    try{ dkRaw=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(w.iv)},key,dec(w.ct)); }
    catch(_){ continue; }
    const dk=await crypto.subtle.importKey('raw',dkRaw,{name:'AES-GCM'},false,['decrypt']);
    const html=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(CFG.ivData)},dk,dec(CFG.ctData));
    return new TextDecoder().decode(html);
  }
  return null;
}
function render(html){
  try{ localStorage.setItem(SK, document.getElementById('c')? document.getElementById('c').value.trim().toUpperCase(): ''); }catch(_){}
  document.open(); document.write(html); document.close();
}
const f=document.getElementById('f'), c=document.getElementById('c'), e=document.getElementById('e'), b=document.getElementById('b');
async function attempt(code,fromStore){
  code=(code||'').trim().toUpperCase(); if(!code) return;
  b.disabled=true; e.textContent=fromStore?'':'لحظة…';
  const html=await unlock(code);
  if(html){ render(html); return; }
  b.disabled=false;
  if(fromStore){ try{localStorage.removeItem(SK);}catch(_){ } e.textContent=''; }
  else e.textContent='الكود غلط — جرّب تاني أو كلّم المسؤول.';
}
f.addEventListener('submit',ev=>{ev.preventDefault(); attempt(c.value,false);});
(function(){ let s=null; try{ s=localStorage.getItem(SK);}catch(_){ } if(s){ c.value=s; attempt(s,true);} })();
